name: Crypto Signal Engine

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分鐘自動巡檢一次全網行情
  workflow_dispatch:        # 同時允許你在手機上手動按按鈕隨時測試

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        run: python main.py
